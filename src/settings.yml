custom_fields:
- keyname: author_bio
  name: About This Plugin
  category: travel
  field_type: author_bio
  description: |
    National Rail Departures shows the next trains from a chosen station to a particular destination, with the scheduled departure and the scheduled arrival at your destination side by side.
    <br><br>
    When a service is not on time the scheduled departure is struck through and the current status follows it &mdash; an expected time, <em>Delayed</em>, or <em>Cancelled</em>. Cancelled services have both times struck through, including services that are running but no longer call at your destination.
    <br><br>
    <strong>Prerequisites</strong>
    <br>
    You will need:<br>
    1. A Rail Data Marketplace API key. If you don't already have one, register at <a href="https://raildata.org.uk/">the Rail Data Marketplace</a>, subscribe to the free "Live Departure Board" data product, and copy the Consumer key from its Specification tab.<br>
    2. The CRS code for your departure and destination stations, which can be found <a href="https://www.nationalrail.co.uk/">on the National Rail website</a>.
    <br><br>
    <strong>Attributions</strong>
    <br>
    The data feed is powered by <a href="https://www.nationalrail.co.uk/developers/">National Rail Enquiries</a>.
    <br>
    Based on the original plugin by <a href="https://github.com/jshiell/trmnl-national-rail-departures">jshiell</a>.
  github_url: https://github.com/danieldeng2/trmnl-national-rail-departures
- keyname: departing_crs
  field_type: string
  name: Departing From
  description: The CRS code for the station you are travelling from
  help_text: You can find this <a href="https://www.nationalrail.co.uk/">on the National Rail website</a>
- keyname: arriving_crs
  field_type: string
  name: Arriving At
  description: The CRS code for the station you are travelling to
  help_text: You can find this <a href="https://www.nationalrail.co.uk/">on the National Rail website</a>
- keyname: api_key
  field_type: string
  name: API Key
  description: Your Rail Data Marketplace consumer key for the Live Departure Board data product
  help_text: Subscribe to the free "Live Departure Board" product on <a href="https://raildata.org.uk/">the Rail Data Marketplace</a> and copy the Consumer key from its Specification tab
- keyname: fast_train_threshold
  field_type: number
  name: Fast Trains Threshold (Minutes)
  optional: true
  min: 0
  description: If set, journeys to your destination shorter than this many minutes are marked with a clock icon. Leave blank to hide the marker.
name: National Rail Departures
description: ''
refresh_interval: 15
